name: Node CI

# Continuous integration gate for landing. Runs on every push and PR.
# The publish workflow fires only on version tags; keeping this green before
# tagging is the release gate.
#
# Jobs: type-check (vue-tsc) → build (vite) → scan (Trivy filesystem)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  type-check:
    name: Type check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (npm advisory DB; complements Trivy)
        run: node .github/audit-gate.mjs
      - name: Type check
        run: npm run type-check
      - name: Lint CSS (stylelint)
        run: npm run lint:css
      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js
      - name: Lint HTML (html-validate)
        run: npm run lint:html

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

  scan:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

name: Node CI

# Continuous integration gate for landing. Runs on every push and PR.
# The publish workflow fires only on version tags; keeping this green before
# tagging is the release gate.
#
# Jobs: type-check (vue-tsc, linters, unit tests) → build (vite, licence notices, inline-script check) →
#       e2e (Playwright + axe, theme × season) · image (build and probe) · scan (Trivy filesystem)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  type-check:
    name: Type check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (npm advisory DB; complements Trivy)
        run: node .github/audit-gate.mjs
      - name: Type check
        run: npm run type-check
      - name: Lint CSS (stylelint)
        run: npm run lint:css
      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js
      - name: Lint HTML (html-validate)
        run: npm run lint:html
      - name: Unit tests
        run: npm test

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      - name: Inline scripts are covered by the CSP
        run: npm run check:csp

  e2e:
    name: Real-browser accessibility (Playwright + axe, theme × season)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Built page and 404 page, every theme × season
        run: npm run test:e2e

  image:
    name: Image (build and probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not pushed. Builds the Dockerfile as the release does (the inline-script check included) and runs the
      # container the way the cluster does: non-root user, read-only root, no capabilities.
      - name: Build (not pushed)
        run: docker build --tag landing:ci .
      - name: Probe the container (user, /, headers, bundle, licences, 404)
        run: bash scripts/smoke.sh landing:ci

  scan:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0
